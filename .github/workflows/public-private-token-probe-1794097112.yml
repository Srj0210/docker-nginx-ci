name: public-source-private-target-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query private target with source token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tmp=$(mktemp)
          status=$(curl -sS -L -o "$tmp" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/Srj0210/bbtest-priv-1782669390/contents/owned-private-source-token-marker-20261108.txt')
          bytes=$(wc -c < "$tmp" | tr -d ' ')
          digest=$(sha256sum "$tmp" | awk '{print $1}')
          marker=0
          if grep -Fq 'PRIVATE_SOURCE_MARKER_20261108' "$tmp"; then marker=1; fi
          printf 'PUBLIC_SOURCE_PRIVATE_TARGET_STATUS=%s BYTES=%s SHA256=%s MARKER_MATCH=%s\n' "$status" "$bytes" "$digest" "$marker"
          rm -f "$tmp"
