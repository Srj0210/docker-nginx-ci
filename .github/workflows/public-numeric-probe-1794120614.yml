name: public-numeric-probe-1794120614
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: request numeric repository contents with repository token
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY_ID: '1283247947'
          MARKER: 'NUMERIC_REPO_ID_MARKER_1794120614_SYNTHETIC_ONLY'
        shell: bash
        run: |
          set +e
          status=$(curl -sS -L -o /tmp/numeric-response -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repositories/$TARGET_REPOSITORY_ID/contents/.github/numeric-repo-id-marker-1794120614.txt?ref=main")
          bytes=$(wc -c < /tmp/numeric-response)
          sha=$(sha256sum /tmp/numeric-response | awk '{print $1}')
          marker=$(MARKER="$MARKER" python3 - /tmp/numeric-response <<'PY'
          import base64, json, os, sys
          marker = 0
          try:
              body = json.load(open(sys.argv[1]))
              content = body.get('content', '') if isinstance(body, dict) else ''
              marker = int(os.environ['MARKER'].encode() in base64.b64decode(content))
          except Exception:
              marker = 0
          print(marker)
          PY
          )
          case "$marker" in 0|1) ;; *) marker=0 ;; esac
          printf 'PUBLIC_SOURCE_NUMERIC_STATUS=%s NUMERIC_BYTES=%s NUMERIC_SHA256=%s MARKER_MATCH=%s\n' "$status" "$bytes" "$sha" "$marker"
