name: public-npm-registry-probe
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query private npm package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          meta=$(mktemp)
          meta_status=$(curl -sS -L -o "$meta" -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/json' 'https://npm.pkg.github.com/@srj0210%2Fpublic-source-npm-canary-1794098453')
          meta_bytes=$(wc -c < "$meta" | tr -d ' ')
          meta_digest=$(sha256sum "$meta" | awk '{print $1}')
          tarball=$(mktemp)
          tar_status=$(curl -sS -L -o "$tarball" -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' 'https://npm.pkg.github.com/download/@srj0210/public-source-npm-canary-1794098453/1.0.0/320bc278a987c425123877eae6006b83d2b33531')
          tar_bytes=$(wc -c < "$tarball" | tr -d ' ')
          tar_digest=$(sha256sum "$tarball" | awk '{print $1}')
          marker=0
          if [ "$tar_status" = 200 ] && tar -xOzf "$tarball" '*/marker.txt' 2>/dev/null | grep -Fq 'PUBLIC_SOURCE_NPM_MARKER_20261108_SYNTHETIC_ONLY'; then marker=1; fi
          printf 'PUBLIC_SOURCE_NPM_META_STATUS=%s META_BYTES=%s META_SHA256=%s TARBALL_STATUS=%s TARBALL_BYTES=%s TARBALL_SHA256=%s MARKER_MATCH=%s\n' "$meta_status" "$meta_bytes" "$meta_digest" "$tar_status" "$tar_bytes" "$tar_digest" "$marker"
          rm -f "$meta" "$tarball"
