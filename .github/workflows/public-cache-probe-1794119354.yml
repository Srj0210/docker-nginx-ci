name: public-cache-probe
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query private cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          meta=$(mktemp)
          meta_status=$(curl -sS -L -o "$meta" -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' 'https://api.github.com/repos/Srj0210/bbtest-priv-1782669390/actions/caches?key=public-source-cache-marker-1794119354')
          meta_bytes=$(wc -c < "$meta" | tr -d ' ')
          meta_digest=$(sha256sum "$meta" | awk '{print $1}')
          cache_id=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(next((str(x.get("id","")) for x in d.get("actions_caches",[]) if x.get("key")=="public-source-cache-marker-1794119354"), ""))' "$meta")
          found=0
          dl_status=NA
          dl_bytes=NA
          dl_digest=NA
          marker=0
          if [ -n "$cache_id" ]; then
            found=1
            dl=$(mktemp)
            dl_status=$(curl -sS -L -o "$dl" -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/Srj0210/bbtest-priv-1782669390/actions/caches/$cache_id")
            dl_bytes=$(wc -c < "$dl" | tr -d ' ')
            dl_digest=$(sha256sum "$dl" | awk '{print $1}')
            if tar -xOzf "$dl" 2>/dev/null | grep -Fq 'PUBLIC_SOURCE_CACHE_MARKER_1794119354_SYNTHETIC_ONLY'; then marker=1; fi
            if [ "$marker" = 0 ] && tar -xOf "$dl" 2>/dev/null | grep -Fq 'PUBLIC_SOURCE_CACHE_MARKER_1794119354_SYNTHETIC_ONLY'; then marker=1; fi
            rm -f "$dl"
          fi
          printf 'PUBLIC_SOURCE_CACHE_META_STATUS=%s META_BYTES=%s META_SHA256=%s CACHE_ID_FOUND=%s CACHE_DOWNLOAD_STATUS=%s CACHE_DOWNLOAD_BYTES=%s CACHE_DOWNLOAD_SHA256=%s MARKER_MATCH=%s\n' "$meta_status" "$meta_bytes" "$meta_digest" "$found" "$dl_status" "$dl_bytes" "$dl_digest" "$marker"
          rm -f "$meta"
