name: public-graphql-probe-1794121189
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query private repository through GraphQL
        env:
          GH_TOKEN: ${{ github.token }}
          QUERY_B64: 'cXVlcnkoJG93bmVyOlN0cmluZyEsJG5hbWU6U3RyaW5nISwkZXhwcjpTdHJpbmchKXtyZXBvc2l0b3J5KG93bmVyOiRvd25lcixuYW1lOiRuYW1lKXtpZCBuYW1lV2l0aE93bmVyIGlzUHJpdmF0ZSBvYmplY3QoZXhwcmVzc2lvbjokZXhwcil7Li4uIG9uIEJsb2J7dGV4dH19fX0='
          VARIABLES_B64: 'eyJvd25lciI6IlNyajAyMTAiLCJuYW1lIjoiYmJ0ZXN0LXByaXYtMTc4MjY2OTM5MCIsImV4cHIiOiJtYWluOi5naXRodWIvZ3JhcGhxbC1wcml2YXRlLW1hcmtlci0xNzk0MTIxMTg5LnR4dCJ9'
          MARKER: 'GRAPHQL_PRIVATE_MARKER_1794121189_SYNTHETIC_ONLY'
        shell: bash
        run: |
          QUERY_B64="$QUERY_B64" VARIABLES_B64="$VARIABLES_B64" MARKER="$MARKER" GH_TOKEN="$GH_TOKEN" python3 - <<'PY'
          import base64, hashlib, json, os, urllib.error, urllib.request
          query = base64.b64decode(os.environ['QUERY_B64']).decode()
          variables = json.loads(base64.b64decode(os.environ['VARIABLES_B64']).decode())
          body = json.dumps({'query': query, 'variables': variables}).encode()
          request = urllib.request.Request('https://api.github.com/graphql', data=body, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'authorized-owned-graphql-probe/1.0'})
          status = 0
          raw = b''
          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  status = response.status
                  raw = response.read(1000000)
          except urllib.error.HTTPError as error:
              status = error.code
              raw = error.read(1000000)
          except Exception:
              status = 0
              raw = b''
          digest = hashlib.sha256(raw).hexdigest()
          marker = 0
          node = 0
          try:
              payload = json.loads(raw.decode('utf-8', 'replace'))
              repository = (payload.get('data') or {}).get('repository') if isinstance(payload.get('data'), dict) else None
              node = int(isinstance(repository, dict) and bool(repository.get('id')))
              obj = repository.get('object') if isinstance(repository, dict) and isinstance(repository.get('object'), dict) else {}
              marker = int(isinstance(obj.get('text'), str) and os.environ['MARKER'] in obj.get('text'))
          except Exception:
              marker = 0
          print('PUBLIC_SOURCE_GRAPHQL_STATUS=%s GRAPHQL_BYTES=%s GRAPHQL_SHA256=%s MARKER_MATCH=%s NODE_PRESENT=%s' % (status, len(raw), digest, marker, node))
          PY
