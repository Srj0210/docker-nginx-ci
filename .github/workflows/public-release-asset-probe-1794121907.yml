name: public-release-asset-probe-1794121907
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: request private release asset with repository token
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: '723205255'
          MARKER: 'PRIVATE_RELEASE_ASSET_MARKER_1794121907_SYNTHETIC_ONLY'
        shell: bash
        run: |
          GH_TOKEN="$GH_TOKEN" ASSET_ID="$ASSET_ID" MARKER="$MARKER" python3 - <<'PY'
          import hashlib, json, os, urllib.error, urllib.request
          url = 'https://api.github.com/repos/Srj0210/bbtest-priv-1782669390/releases/assets/' + os.environ['ASSET_ID']
          request = urllib.request.Request(url, method='GET', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/octet-stream', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'authorized-owned-release-probe/1.0'})
          status = 0
          raw = b''
          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  status = response.status
                  raw = response.read(1000000)
          except urllib.error.HTTPError as error:
              status = error.code
              raw = error.read(1000000)
          except Exception:
              status = 0
              raw = b''
          print('PUBLIC_SOURCE_RELEASE_STATUS=%s RELEASE_BYTES=%s RELEASE_SHA256=%s MARKER_MATCH=%s' % (status, len(raw), hashlib.sha256(raw).hexdigest(), int(os.environ['MARKER'].encode() in raw)))
          PY
