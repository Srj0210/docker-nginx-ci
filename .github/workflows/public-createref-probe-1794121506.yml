name: public-createref-probe-1794121506
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: attempt private target ref creation through GraphQL
        env:
          GH_TOKEN: ${{ github.token }}
          QUERY_B64: 'bXV0YXRpb24oJGlucHV0OkNyZWF0ZVJlZklucHV0ISl7Y3JlYXRlUmVmKGlucHV0OiRpbnB1dCl7cmVme25hbWUgdGFyZ2V0e29pZH19fX0='
          VARIABLES_B64: 'eyJpbnB1dCI6eyJyZXBvc2l0b3J5SWQiOiJSX2tnRE9USHpQU3ciLCJuYW1lIjoicmVmcy9oZWFkcy9wcm9iZS1wdWJsaWMtcmVmLTE3OTQxMjE1MDYiLCJvaWQiOiJkNDFlNTc2ZGIzNDdkMDIyYWIyYTE5NjJjMGQxZDYzZGRmNGZhOWI2In19'
          SOURCE_REF: 'refs/heads/probe-public-ref-1794121506'
        shell: bash
        run: |
          QUERY_B64="$QUERY_B64" VARIABLES_B64="$VARIABLES_B64" GH_TOKEN="$GH_TOKEN" SOURCE_REF="$SOURCE_REF" python3 - <<'PY'
          import base64, hashlib, json, os, urllib.error, urllib.request
          query = base64.b64decode(os.environ['QUERY_B64']).decode()
          variables = json.loads(base64.b64decode(os.environ['VARIABLES_B64']).decode())
          body = json.dumps({'query': query, 'variables': variables}).encode()
          request = urllib.request.Request('https://api.github.com/graphql', data=body, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'authorized-owned-createref-probe/1.0'})
          status = 0
          raw = b''
          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  status = response.status
                  raw = response.read(1000000)
          except urllib.error.HTTPError as error:
              status = error.code
              raw = error.read(1000000)
          except Exception:
              status = 0
              raw = b''
          digest = hashlib.sha256(raw).hexdigest()
          ref_present = 0
          ref_name_match = 0
          try:
              payload = json.loads(raw.decode('utf-8', 'replace'))
              created = (payload.get('data') or {}).get('createRef') if isinstance(payload.get('data'), dict) else None
              ref = created.get('ref') if isinstance(created, dict) else None
              name = ref.get('name') if isinstance(ref, dict) else None
              ref_present = int(bool(ref))
              ref_name_match = int(name == os.environ['SOURCE_REF'])
          except Exception:
              pass
          print('PUBLIC_SOURCE_CREATEREF_STATUS=%s GRAPHQL_BYTES=%s GRAPHQL_SHA256=%s REF_PRESENT=%s REF_NAME_MATCH=%s' % (status, len(raw), digest, ref_present, ref_name_match))
          PY
