name: public-git-transport-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: query private repository over Git smart HTTP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          repo_url='https://github.com/Srj0210/bbtest-priv-1782669390.git'
          refs=$(mktemp)
          refs_status=0
          git -c "http.extraHeader=Authorization: Bearer $GH_TOKEN" ls-remote "$repo_url" > "$refs" 2>&1 || refs_status=$?
          refs_bytes=$(wc -c < "$refs" | tr -d ' ')
          refs_digest=$(sha256sum "$refs" | awk '{print $1}')
          main_ref=0
          if grep -Fq 'refs/heads/main' "$refs"; then main_ref=1; fi
          clone_status=NA
          clone_bytes=NA
          marker=0
          if [ "$main_ref" = 1 ]; then
            clone_dir=$(mktemp -d)
            clone_status=0
            git -c "http.extraHeader=Authorization: Bearer $GH_TOKEN" clone --depth=1 --no-tags --branch main "$repo_url" "$clone_dir/repo" >/dev/null 2>&1 || clone_status=$?
            clone_bytes=$(du -sb "$clone_dir/repo" 2>/dev/null | awk '{print $1}' || printf '0')
            if [ -f "$clone_dir/repo/public-source-git-transport-marker-20261108.txt" ] && grep -Fq 'PUBLIC_SOURCE_GIT_TRANSPORT_MARKER_20261108_SYNTHETIC_ONLY' "$clone_dir/repo/public-source-git-transport-marker-20261108.txt"; then marker=1; fi
            rm -rf "$clone_dir"
          fi
          printf 'PUBLIC_SOURCE_GIT_REFS_STATUS=%s REFS_BYTES=%s REFS_SHA256=%s MAIN_REF=%s CLONE_STATUS=%s CLONE_BYTES=%s MARKER_MATCH=%s\n' "$refs_status" "$refs_bytes" "$refs_digest" "$main_ref" "$clone_status" "$clone_bytes" "$marker"
          rm -f "$refs"
